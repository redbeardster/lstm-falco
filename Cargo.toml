[package]
name = "enterprise-security-stack"
version = "0.1.0"
edition = "2021"

[dependencies]

nalgebra = "0.32"

tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Web framework
axum = "0.7"

# Seccomp
seccompiler = "0.3"
libc = "0.2"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

ndarray = "0.15"
rand = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Kubernetes
kube = { version = "0.89", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.21", features = ["v1_25"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Security
jsonwebtoken = "9.2"
argon2 = "0.5"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Metrics (optional)
prometheus = { version = "0.13", optional = true }
lazy_static = { version = "1.4", optional = true }
csv = "1.3"  # для CSV экспорта


[features]
default = []
metrics = ["prometheus", "lazy_static"]

[[bin]]
name = "enterprise-security-stack"
path = "src/main.rs"

[[example]]
name = "threat_simulator"
path = "examples/threat_simulator.rs"

[[example]]
name = "generate_training_data"
path = "examples/generate_training_data.rs"

[[example]]
name = "train_simple_classifier"
path = "examples/train_simple_classifier.rs"

[[example]]
name = "event_generator"
path = "examples/event_generator.rs"

[[example]]
name = "training_scenarios"
path = "examples/training_scenarios.rs"
