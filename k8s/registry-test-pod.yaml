apiVersion: v1
kind: Namespace
metadata:
  name: security-test
---
apiVersion: v1
kind: Pod
metadata:
  name: security-stack-test
  namespace: security-test
  labels:
    app: security-stack-test
spec:
  containers:
    - name: security-stack
      image: 192.168.0.7:5000/enterprise-security-stack:latest
      imagePullPolicy: Always
      env:
        - name: RUST_LOG
          value: "enterprise_security=info,guardd=info"
        - name: EBPF_PROGRAM_PATH
          value: "/opt/seccomp/ebpf/seccomp_monitor.o"
      ports:
        - containerPort: 3000
          name: api
          protocol: TCP
        - containerPort: 8080
          name: falco
          protocol: TCP
        - containerPort: 8081
          name: guardd
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: security-stack-test
  namespace: security-test
spec:
  type: NodePort
  selector:
    app: security-stack-test
  ports:
    - name: api
      port: 3000
      targetPort: 3000
      nodePort: 30000
    - name: falco
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: guardd
      port: 8081
      targetPort: 8081
      nodePort: 30081
